# Runs on every merge to main. Builds the api and worker images, tags them with
# the commit SHA and pushes them to the GitHub Container Registry; then, once
# KUBECONFIG is set as a repository secret, rolls both Deployments to that tag
# and waits for each (proposal section 2.7). The rollout step has not run yet:
# no cluster credentials exist in the repository; #76 replaces this check.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "worker/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

# Package names on ghcr.io must be lowercase; the repository name is not
env:
  REGISTRY: ghcr.io/nabeegh-khan

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to ghcr.io, no extra secret
    strategy:
      matrix:
        service: [api, worker] # one image per service folder, built in parallel
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          # Two tags: the SHA for rollouts and rollbacks, latest for laptops
          tags: |
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/contentcollab-${{ matrix.service }}:latest
          # Reuses layers from the last build so the npm ci layer is cached
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  rollout:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Until stage 3 the secret is empty and the job stops here, green
      - name: Check for a cluster
        id: cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "No KUBECONFIG secret: image pushed, no rollout"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/setup-kubectl@v4
        if: steps.cluster.outputs.present == 'true'
      - name: Run database migration and roll out Deployments
        if: steps.cluster.outputs.present == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -e

          # Apply infrastructure without applying API or worker Deployments
          kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/doks/infra | kubectl apply -f -

          # Wait for PostgreSQL to become ready
          kubectl -n contentcollab rollout status statefulset/postgres --timeout=180s

          # Create a migration Job for this commit
          JOB_NAME="db-migrate-${GITHUB_SHA}"
          sed "s/__IMAGE_TAG__/${GITHUB_SHA}/g" k8s/doks/migrate-job.yaml | kubectl apply -f -

          # Wait for the migration to finish successfully
          kubectl -n contentcollab wait \
            --for=condition=complete \
            "job/${JOB_NAME}" \
            --timeout=180s

          # Apply application resources using the images built for this commit
          kubectl kustomize k8s/doks \
            | sed \
                -e "s|ghcr.io/nabeegh-khan/contentcollab-api:latest|ghcr.io/nabeegh-khan/contentcollab-api:${GITHUB_SHA}|g" \
                -e "s|ghcr.io/nabeegh-khan/contentcollab-worker:latest|ghcr.io/nabeegh-khan/contentcollab-worker:${GITHUB_SHA}|g" \
            | kubectl apply -f -

          # Wait for both Deployments to become ready
          kubectl -n contentcollab rollout status deployment/api --timeout=180s
          kubectl -n contentcollab rollout status deployment/worker --timeout=180s